<svg fill="none" viewBox="0 0 800 460" width="800" height="460" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                .container {
                    width: 800px;
                    height: 460px;
                    background: linear-gradient(135deg, #101820 0%, #1F3A5F 100%);
                    border-radius: 10px;
                    padding: 20px 32px;
                    font-family: ui-monospace, 'SF Mono', Monaco, 'Cascadia Code', 'Courier New', monospace;
                }
                .terminal-header {
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    padding: 8px;
                    background-color: rgba(0, 0, 0, 0.3);
                    border-radius: 8px;
                    margin-bottom: 12px;
                }
                .circle { width: 12px; height: 12px; border-radius: 50%; }
                .red { background: #FF5F56; }
                .yellow { background: #FFBD2E; }
                .green { background: #27C93F; }

                .command-line {
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    margin-bottom: 10px;
                    font-size: 19px;
                    opacity: 0;
                    animation: fadeIn 0.3s ease-out forwards;
                }
                .arrow { color: #FF6B35; font-weight: bold; }
                .spinner { color: #FF6B35; font-size: 17px; }
                .spinner::before {
                    content: '⣾';
                    animation: rotate 1.2s linear infinite, complete 0s 5.0s forwards;
                }
                @keyframes rotate {
                    0% { content: '⣾'; }
                    12.5% { content: '⣽'; }
                    25% { content: '⣻'; }
                    37.5% { content: '⢿'; }
                    50% { content: '⡿'; }
                    62.5% { content: '⣟'; }
                    75% { content: '⣯'; }
                    87.5% { content: '⣷'; }
                    100% { content: '⣷'; }
                }
                @keyframes complete {
                    to { content: '✓'; color: #27C93F; }
                }
                .command {
                    color: #FFD9CC;
                    overflow: hidden;
                    border-right: 2px solid #FFD9CC;
                    white-space: nowrap;
                    width: 0;
                    animation:
                        typing 1s steps(10) 0.3s forwards,
                        blink 0.75s step-end 0s 2,
                        hideCursor 0s 1.5s forwards;
                }
                @keyframes typing {
                    from { width: 0; }
                    to { width: 11em; }
                }
                @keyframes blink { 50% { border-color: transparent; } }
                @keyframes hideCursor { to { border-color: transparent; } }

                .command2 {
                    color: #FFD9CC;
                    overflow: hidden;
                    border-right: 2px solid #FFD9CC;
                    white-space: nowrap;
                    width: 0;
                    animation:
                        typing2 1s steps(14) 4.6s forwards,
                        blink2 0.75s step-end 4.6s 2,
                        hideCursor2 0s 6.0s forwards;
                }
                @keyframes typing2 {
                    from { width: 0; }
                    to { width: 15em; }
                }
                @keyframes blink2 { 50% { border-color: transparent; } }
                @keyframes hideCursor2 { to { border-color: transparent; } }

                .command3 {
                    color: #FFD9CC;
                    overflow: hidden;
                    border-right: 2px solid #FFD9CC;
                    white-space: nowrap;
                    width: 0;
                    animation:
                        typing3 0.9s steps(15) 9.6s forwards,
                        blink3 0.75s step-end 9.6s 2,
                        hideCursor3 0s 11.0s forwards;
                }
                @keyframes typing3 {
                    from { width: 0; }
                    to { width: 16em; }
                }
                @keyframes blink3 { 50% { border-color: transparent; } }
                @keyframes hideCursor3 { to { border-color: transparent; } }

                .output {
                    display: flex;
                    flex-direction: column;
                    gap: 6px;
                    font-size: 16px;
                }
                .line { display: flex; gap: 10px; align-items: flex-start; opacity: 0; }
                .line:nth-child(1) { animation: fadeInUp 0.5s ease-out 1.3s forwards; }
                .line:nth-child(2) { animation: fadeInUp 0.5s ease-out 1.8s forwards; }
                .bullet { color: #FF6B35; flex-shrink: 0; }
                .text { color: #B8B8B8; line-height: 1.6; }
                .highlight { color: #FFD9CC; font-weight: 500; }
                .typing-line {
                    overflow: hidden;
                    white-space: nowrap;
                    width: 0;
                    animation: typeLine 2.5s steps(70) 2.0s forwards;
                }
                @keyframes typeLine { to { width: 100%; } }

                .work .line { animation: fadeInUp 0.5s ease-out 6.4s forwards; }
                .work .line:nth-child(2) { animation-delay: 6.9s; }

                .stack { display: flex; flex-direction: column; gap: 8px; }
                .stack .line { animation: fadeInUp 0.5s ease-out 11.4s forwards; }
                .stack .line:nth-child(2) { animation-delay: 11.9s; }
                .stack .line:nth-child(3) { animation-delay: 12.4s; }
                .stack .line:nth-child(4) { animation-delay: 12.9s; }
                .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
                .cat-label { color: #6FA8DC; font-weight: 600; font-size: 14px; flex-shrink: 0; }
                .tag {
                    font-size: 13px;
                    color: #101820;
                    background: #FFD9CC;
                    padding: 3px 10px;
                    border-radius: 4px;
                    font-weight: 600;
                }
                .tag-alt { background: #6FA8DC; }
                .focus-box {
                    font-size: 13px;
                    color: #FFD9CC;
                    border: 1px solid rgba(255, 217, 204, 0.45);
                    background: rgba(0, 0, 0, 0.28);
                    padding: 4px 12px;
                    border-radius: 6px;
                    font-weight: 600;
                    letter-spacing: 0.3px;
                }
                .cmd2-line {
                    display: flex; align-items: center; gap: 12px;
                    font-size: 19px; margin: 14px 0 10px;
                    opacity: 0;
                    animation: fadeIn 0.3s ease-out 4.6s forwards;
                }
                .cmd3-line {
                    display: flex; align-items: center; gap: 12px;
                    font-size: 19px; margin: 14px 0 10px;
                    opacity: 0;
                    animation: fadeIn 0.3s ease-out 9.6s forwards;
                }
                @keyframes fadeIn { to { opacity: 1; } }
                @keyframes fadeInUp {
                    from { opacity: 0; transform: translateY(10px); }
                    to { opacity: 1; transform: translateY(0); }
                }
            </style>
            <div class="container">
                <div class="terminal-header">
                    <div class="circle red"></div>
                    <div class="circle yellow"></div>
                    <div class="circle green"></div>
                </div>
                <div class="command-line">
                    <span class="arrow">&gt;</span>
                    <span class="spinner"></span>
                    <span class="command">whoami</span>
                </div>
                <div class="output">
                    <div class="line">
                        <span class="bullet">⏺</span>
                        <span class="text"><span class="highlight">Ricky Macharm, MScFE</span> – Data Scientist × Data/AI Engineer</span>
                    </div>
                    <div class="line">
                        <span class="bullet">⏺</span>
                        <span class="text typing-line">Building AI assistants for clients, tailored to their needs</span>
                    </div>
                </div>
                <div class="cmd2-line">
                    <span class="arrow">&gt;</span>
                    <span class="command2">cat what_i_do.txt</span>
                </div>
                <div class="output work">
                    <div class="line">
                        <span class="bullet">⏺</span>
                        <span class="text">AI assistant / agent platform for clients</span>
                    </div>
                    <div class="line">
                        <span class="bullet">⏺</span>
                        <span class="text">AI automations</span>
                    </div>
                </div>
                <div class="cmd3-line">
                    <span class="arrow">&gt;</span>
                    <span class="command3">cat tech_stack.txt</span>
                </div>
                <div class="output stack">
                    <div class="line">
                        <span class="bullet">⏺</span>
                        <span class="row">
                            <span class="cat-label">Languages:</span>
                            <span class="tag">Python</span>
                            <span class="tag tag-alt">Rust</span>
                            <span class="tag">TypeScript</span>
                            <span class="tag tag-alt">SQL</span>
                        </span>
                    </div>
                    <div class="line">
                        <span class="bullet">⏺</span>
                        <span class="row">
                            <span class="cat-label">Frameworks:</span>
                            <span class="tag">PyTorch</span>
                            <span class="tag tag-alt">FastAPI</span>
                            <span class="tag">Axum</span>
                        </span>
                    </div>
                    <div class="line">
                        <span class="bullet">⏺</span>
                        <span class="row">
                            <span class="cat-label">Data &amp; Tools:</span>
                            <span class="tag">DuckDB</span>
                            <span class="tag tag-alt">Docker</span>
                            <span class="tag">Quarto</span>
                            <span class="tag tag-alt">Jupyter</span>
                            <span class="tag">Supabase</span>
                            <span class="tag tag-alt">Qdrant</span>
                        </span>
                    </div>
                    <div class="line">
                        <span class="bullet">⏺</span>
                        <span class="row">
                            <span class="cat-label">Focus:</span>
                            <span class="focus-box">LLM Apps</span>
                            <span class="focus-box">Low-resource NLP</span>
                            <span class="focus-box">Algorithmic Trading</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </foreignObject>
</svg>
